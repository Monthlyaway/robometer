train_datasets:
  - "abraranwar/libero_rfm"
  - "ykorkmaz/libero_failure_rfm"

train_subsets:
  - ["libero256_10", "libero256_object", "libero256_spatial", "libero256_goal"]
  - ["libero_10_failure", "libero_object_failure", "libero_spatial_failure", "libero_goal_failure"]

eval_datasets:
  - "abraranwar/libero_rfm"
  - "ykorkmaz/libero_failure_rfm"

eval_subsets:
  - ["libero256_90"]
  - ["libero_90_failure"]

cache_dir: "/root/autodl-tmp/processed_datasets"

# 目录结构说明: # ROBOMETER_DATASET_PATH    = /root/autodl-tmp/raw_datasets     (原始 HF 下载)
# ROBOMETER_PROCESSED_DATASETS_PATH = /root/autodl-tmp/processed_datasets (预处理输出)
# cache_dir 必须和 ROBOMETER_PROCESSED_DATASETS_PATH 一致
max_frames_for_preprocessing: 64
video_frame_sampling: "uniform"
num_proc: 1
num_threads: 8
force_reprocess: false
precompute_embeddings: false
